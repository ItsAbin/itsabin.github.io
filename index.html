<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Under Construction</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml,
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="black"/>
      <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle"
        font-size="78" font-family="monospace" font-weight="700" fill="%23e62429">!</text>
    </svg>'
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0c;
      color: #ffffff;
      font-family: "IBM Plex Mono", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 0.95;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e62429;
      text-shadow:
        0 0 10px rgba(255,0,0,0.6),
        0 0 30px rgba(255,0,0,0.3);
      margin-bottom: 24px;
    }

    /* Terminal */
    .terminal {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: #e62429;
      line-height: 2.0;
    }

    .terminal-line {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      opacity: 0;
    }

    .terminal-line.typed {
      opacity: 1;
      animation: typeIn var(--duration, 0.1s) steps(var(--chars, 30)) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes typeIn {
      from { width: 0; }
      to   { width: 100%; }
    }

    .message {
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 2;
      max-width: 650px;
      min-height: 2.5em;
      color: #999;

      white-space: normal;
      overflow-wrap: break-word;
    }

    #typed-msg,
    .cursor {
      display: inline;
    }

    #blink-cursor {
      white-space: nowrap;
    }
    .highlight { color: #f2bc18; }

    .cursor {
      animation: blink 1s steps(1) infinite;
      color: #ffcc00;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* Countdown — hidden until message done */
    .progress-container {
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      margin-top: 24px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .progress-container.visible {
      visibility: visible;
      opacity: 1;
    }

    #progress-text {
      font-weight: 700;
      color: #f2bc18;
    }

    .advice {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #444;
    }

    /* Right side — Iron Man sprite */
    .sprite-side {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ironman-wrap {
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(230,36,41,0.55)) drop-shadow(0 0 40px rgba(230,36,41,0.25));
      cursor: pointer;
      text-decoration: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-18px); }
    }

    .ironman-wrap:hover svg {
      filter: brightness(1.3);
    }

    @media (max-width: 850px) {
      .screen { grid-template-columns: 1fr; text-align: center; }
      .content { align-items: center; }
    }

  </style>
</head>
<audio id="lion-audio" src="audio/lion.mp3"></audio>

<script>
  const msPerChar = 30;
  const linePause = 120;

  // --- Terminal lines ---
  const lines = document.querySelectorAll('.terminal-line');
  let cursor = 0;
  lines.forEach((line) => {
    const chars = line.dataset.text.length;
    const duration = (chars * msPerChar) / 1000;
    line.style.setProperty('--delay', (cursor / 1000) + 's');
    line.style.setProperty('--duration', duration + 's');
    line.style.setProperty('--chars', chars);
    setTimeout(() => line.classList.add('typed'), cursor);
    cursor += chars * msPerChar + linePause;
  });

  // --- Message typing ---
  const msgEl     = document.getElementById('message');
  const typedSpan = document.getElementById('typed-msg');
  const blinkCur  = document.getElementById('blink-cursor');

  const segments = [
    { text: 'Expected ',       open: '<span class="highlight">', close: '</span>' },
    { text: 'to return ',           open: '',                          close: ''        },
    { text: 'in Avengers Doomsday', open: '<span class="highlight">', close: '</span>' },
    { text: ' :)',      open: '<span style="color:#444">', close: '</span>' },
  ];
  const fullText = segments.map(s => s.text).join('');

  function startMsgType() {
    msgEl.style.visibility = 'visible';
    blinkCur.style.display = 'inline';
    let charIndex = 0;
    const iv = setInterval(() => {
      charIndex++;
      let built = '', counted = 0;
      for (const seg of segments) {
        if (counted >= charIndex) break;
        const take = Math.min(seg.text.length, charIndex - counted);
        built += take === seg.text.length
          ? seg.open + seg.text + seg.close
          : seg.text.slice(0, take);
        counted += seg.text.length;
      }
      typedSpan.innerHTML = built;
      if (charIndex >= fullText.length) {
        clearInterval(iv);
        // Reveal countdown after message finishes
        startCountdown();
      }
    }, msPerChar);
  }

  const lastLine = lines[lines.length - 1];

  lastLine.addEventListener('animationend', () => {
    startMsgType();
  });

  // --- Countdown (revealed after message) ---
  const startTime  = new Date('2025-12-18T00:00:00Z').getTime();
  const targetTime = new Date('2026-12-18T00:00:00Z').getTime();
  const textEl     = document.getElementById('progress-text');
  const wrap       = document.getElementById('countdown-wrap');

  function updateCountdown() {
    const now       = Date.now();
    const remaining = targetTime - now;
    if (remaining <= 0) {
      textEl.textContent = 'DOOMSDAY HAS ARRIVED';
      return;
    }
    const days    = Math.floor(remaining / 86400000);
    const hours   = Math.floor((remaining / 3600000) % 24);
    const minutes = Math.floor((remaining / 60000) % 60);
    const seconds = Math.floor((remaining / 1000) % 60);
    textEl.textContent =
      `${days}D ${String(hours).padStart(2,'0')}H ` +
      `${String(minutes).padStart(2,'0')}M ${String(seconds).padStart(2,'0')}S LEFT`;
  }

  function startCountdown() {
    wrap.classList.add('visible');
    updateCountdown();
    setInterval(updateCountdown, 1000);
  }
  function playLion() {
    const audio = document.getElementById("lion-audio");
    audio.currentTime = 0;
    audio.play();
}
</script>

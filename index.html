  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml,
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="black"/>

</head>

      <div class="terminal" id="terminal">

      </div>

        <span id="typed-msg"></span>
        <span class="cursor" id="blink-cursor" style="display:none;">█</span>
      </p>

      <div class="progress-container" id="countdown-wrap">
        <div id="progress-text">——</div>
      </div>

      <div class="advice">
        Error Code: 0xREDCENTER_DOOM

    </div>

    <div class="sprite-side">

      <div class="sprite-hint">

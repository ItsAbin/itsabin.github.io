<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Under Construction</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml,
    <svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100">
      <rect width="100" height="100" fill="black"/>
      <text x="50%" y="56%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-size="78"
        font-family="monospace"
        font-weight="700"
        fill="%23e62429">!</text>
    </svg>'
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0c; /* Deep metallic dark slate */
      color: #ffffff;
      font-family: "IBM Plex Mono", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 0.95;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e62429; /* Marvel Red */
    }

    .message {
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.6;
      max-width: 650px;
      color: #999;
    }

    .highlight {
      color: #f2bc18; /* Doomsday Accent Gold */
    }

    .progress-container {
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
    }

    #progress-text {
      font-weight: 700;
      color: #f2bc18;
      margin-bottom: 8px;
    }

    #progress-bar {
      white-space: nowrap;
      overflow: hidden;
      color: #e62429;
    }

    .qr-box {
      margin-top: 10px;
      border: 3px solid #e62429;
      padding: 12px;
      width: fit-content;
      background: #ffffff;
    }

    .qr-box svg {
      width: 180px;
      height: 180px;
      display: block;
      shape-rendering: crispEdges;
    }

    .qr-box svg rect.bg { fill: #ffffff; }
    .qr-box svg g.fg { fill: #0a0a0c; }

    .question-side {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .question-mark {
    font-size: clamp(10rem, 28vw, 22rem);
    font-weight: 700;
    color: #333;
    text-decoration: none;
    line-height: 1;
    transition: color 0.2s, transform 0.2s;
    user-select: none;

    animation: rotateMark 18s linear infinite;
    }

    @keyframes rotateMark {
    from {
        transform: rotate(0deg);
     }

    to {
        transform: rotate(360deg);
     }
    }

    .question-mark:hover {
    color: #e62429;
    }

    .footer {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #444;
    }

    @media (max-width: 850px) {
      .screen {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .content { align-items: center; }
      .qr-box { margin-inline: auto; }
    }

    /* CRT scanline simulation */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.01),
        rgba(255,255,255,0.01) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }
  </style>
</head>

<script>
  const startTime = new Date('2025-12-18T00:00:00Z').getTime();

  const targetTime = new Date('2026-12-18T00:00:00Z').getTime();

  const textEl = document.getElementById('progress-text');

  const barEl = document.getElementById('progress-bar');

  function updateCountdown() {

    const now = Date.now();
    const remaining = targetTime - now;
    const totalDuration = targetTime - startTime;
    const elapsed = now - startTime;
    if (remaining <= 0) {

      textEl.textContent =
        'DOOMSDAY HAS ARRIVED';

      barEl.textContent =
        '[████████████████████] 100.00%';

      return;
    }

    const days = Math.floor(
      remaining / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
      (remaining / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (remaining / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (remaining / 1000) % 60
    );


    const progress = (elapsed / totalDuration) * 100;

    // Keep percentage between 0 and 100
    const safeProgress = Math.min(
      Math.max(progress, 0),100
    );
    const percent = safeProgress.toFixed(2);

    // Build visual progress bar
    const totalBlocks = 20;
    const filledBlocks = Math.floor(
      (safeProgress / 100) * totalBlocks
    );
    const visualBar =
      '[' +
      '█'.repeat(filledBlocks) +
      '░'.repeat(totalBlocks - filledBlocks) +
      `] ${percent}%`;

    // Update countdown text

    textEl.textContent =
      `${days}D ` +
      `${String(hours).padStart(2, '0')}H ` +
      `${String(minutes).padStart(2, '0')}M ` +
      `${String(seconds).padStart(2, '0')}S`;

    // Update progress bar

    barEl.textContent =
      visualBar;
  }

  updateCountdown();

  // Update every second
  setInterval(updateCountdown, 1000);
</script>
